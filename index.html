<style>
/* Layout idea: one narrow left-aligned column on a turmeric ground, like the label on an
   Indian grocery tin. One question per screen, very large tap targets, indigo for anything
   you can press, red only for the final "we are making this" decision. */
:root {
  color-scheme: light;
  --haldi: #F4B81A;
  --haldi-deep: #D99A00;
  --neel: #1B2A6B;
  --paper: #FFFFFF;
  --mirch: #A3200F;
  --leaf: #17592F;
  --slate: #4A5266;
  --rule: rgba(27, 42, 107, .22);
  --display: "Anek Latin", "Anek Devanagari", "Anek Gujarati", system-ui, sans-serif;
  --body: "Mukta", "Mukta Vaani", "Noto Sans Gujarati", "Noto Sans Devanagari", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--haldi);
  color: var(--neel);
  font-family: var(--body);
  font-size: 20px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 4px solid var(--paper); outline-offset: 3px; }
#app { max-width: 560px; margin: 0 auto; padding: 16px 18px 48px; display: flex; flex-direction: column; gap: 20px; min-height: 100%; }

.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; }
.bar-btn {
  background: transparent; border: 2px solid var(--neel); border-radius: 999px;
  min-height: 52px; padding: 6px 20px; font-family: var(--display); font-weight: 700; font-size: 20px;
  display: inline-flex; align-items: center; gap: 8px;
}
.bar-btn svg { width: 14px; height: 22px; flex: none; }
.spacer { flex: 1; }

h1 {
  font-family: var(--display); font-weight: 700; font-size: clamp(36px, 10.5vw, 52px);
  line-height: 1.12; margin: 4px 0 0; text-wrap: balance; letter-spacing: -.01em;
}
h1.small { font-size: clamp(30px, 8.5vw, 40px); }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* meal switch */
.meals { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid var(--neel); border-radius: 12px; overflow: hidden; }
.meals button { background: transparent; border: 0; border-left: 2px solid var(--neel); min-height: 56px; padding: 6px 2px; font-family: var(--display); font-weight: 500; font-size: 18px; line-height: 1.15; }
.meals button:first-child { border-left: 0; }
.meals button[aria-pressed="true"] { background: var(--neel); color: var(--haldi); font-weight: 700; }

/* big choices */
.door {
  width: 100%; text-align: left; background: var(--paper); border: 0; border-radius: 12px;
  padding: 16px 20px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
}
.door b { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.2; }
.door span { color: var(--slate); font-size: 18px; }
.door.lead { background: var(--neel); color: var(--paper); min-height: 108px; }
.door.lead b { font-size: 32px; color: var(--haldi); }
.door.lead span { color: var(--paper); }
.door:active, .row:active, .card:active { transform: translateY(2px); }

/* list rows (moods, kinds) */
.row {
  width: 100%; text-align: left; background: var(--paper); border: 0; border-radius: 12px;
  min-height: 72px; padding: 12px 18px; display: flex; align-items: center; gap: 16px;
  font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.2;
}
.bowl { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 3px rgba(255,255,255,.55), 0 0 0 2px var(--neel); }

/* ingredient chips */
.chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.chip {
  background: var(--paper); border: 2px solid transparent; border-radius: 12px; min-height: 64px; padding: 8px 14px;
  text-align: left; font-family: var(--display); font-weight: 500; font-size: 22px; line-height: 1.15;
  display: flex; align-items: center; gap: 10px;
}
.chip i { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--neel); flex: none; display: grid; place-items: center; }
.chip[aria-pressed="true"] { background: var(--neel); color: var(--paper); font-weight: 700; }
.chip[aria-pressed="true"] i { background: var(--haldi); border-color: var(--haldi); }
.chip[aria-pressed="true"] i::after { content: ""; width: 6px; height: 12px; border: solid var(--neel); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.sticky { position: sticky; bottom: 0; padding: 12px 0 14px; background: linear-gradient(to top, var(--haldi) 70%, rgba(244,184,26,0)); }

.go {
  width: 100%; background: var(--neel); color: var(--haldi); border: 0; border-radius: 12px; min-height: 68px;
  font-family: var(--display); font-weight: 700; font-size: 26px; padding: 10px 18px;
}
.go:disabled { background: transparent; color: var(--neel); border: 2px dashed var(--neel); font-weight: 500; font-size: 20px; cursor: default; }
.go.alt { background: transparent; color: var(--neel); border: 2px solid var(--neel); }
.go.decide { background: var(--mirch); color: var(--paper); }
.go.done { background: var(--paper); color: var(--neel); font-size: 20px; font-weight: 500; }

/* result cards */
.card { width: 100%; text-align: left; background: var(--paper); border: 0; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.card b { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.18; text-wrap: balance; }
.card .en { color: var(--slate); font-size: 17px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 19px; }
.time { font-family: var(--display); font-weight: 700; background: var(--haldi); border-radius: 6px; padding: 1px 10px; font-variant-numeric: tabular-nums; }
.note { color: var(--mirch); font-size: 18px; }
.have { color: var(--slate); font-size: 18px; }
.good { color: var(--leaf); font-family: var(--display); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.good::before { content: ""; width: 12px; height: 12px; border-radius: 50% 0 50% 50%; background: var(--leaf); transform: rotate(45deg); }
.grp { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 14px 0 0; padding-bottom: 4px; border-bottom: 2px solid var(--neel); }
.grp:first-of-type { margin-top: 0; }
.empty { background: var(--paper); border-radius: 12px; padding: 20px; }

/* recipe sheet */
.sheet { background: var(--paper); border-radius: 12px; padding: 22px 20px; display: flex; flex-direction: column; gap: 22px; }
.sheet h2 { font-family: var(--display); font-weight: 700; font-size: 24px; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--rule); }
.sheet ul, .sheet ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.sheet ul li { padding-left: 20px; position: relative; }
.sheet ul li::before { content: ""; position: absolute; left: 0; top: .62em; width: 9px; height: 9px; border-radius: 50%; background: var(--haldi-deep); }
.sheet ol { counter-reset: s; gap: 14px; }
.sheet ol li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.sheet ol li::before { content: counter(s); font-family: var(--display); font-weight: 700; font-size: 22px; width: 40px; height: 40px; border-radius: 50%; background: var(--neel); color: var(--haldi); display: grid; place-items: center; }
.sheet .eng { color: var(--slate); font-size: 17px; margin: 0; }

.langs { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.langs .door b { font-size: 34px; }
.who { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  ["south", "South Indian", "साउथ इंडियन", "સાઉથ ઇન્ડિયન"],
  ["street", "Street food and chaat", "स्ट्रीट फ़ूड और चाट", "સ્ટ્રીટ ફૂડ અને ચાટ"],
  ["sand", "Sandwiches", "सैंडविच", "સેન્ડવિચ"],
  ["ital", "Italian: pasta, pizza", "इटालियन: पास्ता, पिज़्ज़ा", "ઇટાલિયન: પાસ્તા, પિઝા"],
  ["mex", "Mexican and wraps", "मैक्सिकन और रोल", "મેક્સિકન અને રોલ"],
  ["asian", "Asian and Chinese", "एशियन और चाइनीज़", "એશિયન અને ચાઇનીઝ"],
  ["chilla", "Chilla", "चीला", "ચીલા"],
  ["salad", "Salads, soups, starters", "सलाद, सूप, स्टार्टर", "સલાડ, સૂપ, સ્ટાર્ટર"],
  ["bs", "Breakfast and snacks", "नाश्ता और हल्का फुल्का", "નાસ્તો"],
  ["des", "Dessert", "मीठा", "મીઠાઈ"]
];
const without = (re, drop) => s => re.test(s.replace(drop, ""));
const GROUPS = [
  [["Potato", "आलू", "બટાકા", without(/potato/, /sweet potato/g)], ["Cauliflower", "फूलगोभी", "ફ્લાવર", /cauliflower/],
   ["Green peas", "मटर", "વટાણા", without(/\bpeas\b/, /white peas/g)], ["Spinach", "पालक", "પાલક", /spinach/],
   ["Methi", "मेथी", "મેથી", without(/fenugreek|methi/, /fenugreek seeds|kasuri methi/g)], ["Bhindi", "भिंडी", "ભીંડા", /okra/],
   ["Brinjal", "बैंगन", "રીંગણ", /brinjal/], ["Lauki", "लौकी", "દૂધી", /bottle gourd/],
   ["Cabbage", "पत्ता गोभी", "કોબી", /cabbage/], ["Carrot", "गाजर", "ગાજર", /carrot/],
   ["Capsicum", "शिमला मिर्च", "કેપ્સિકમ", /capsicum/], ["Beans", "फ्रेंच बीन्स", "ફણસી", /(^|, )beans\b/],
   ["Sweet corn", "मकई", "મકાઈ", /\bcorn\b/], ["Cucumber", "खीरा", "કાકડી", /cucumber/],
   ["Mushroom", "मशरूम", "મશરૂમ", /mushroom/], ["Beetroot", "चुकंदर", "બીટ", /beetroot/],
   ["Sweet potato", "शकरकंद", "શક્કરિયા", /sweet potato/], ["Broccoli", "ब्रोकली", "બ્રોકોલી", /broccoli/],
   ["Tindora", "कुंदरू", "ટીંડોળા", /ivy gourd/], ["Guvar", "ग्वार फली", "ગુવાર", /cluster beans/],
   ["Karela", "करेला", "કારેલા", /bitter gourd/], ["Radish", "मूली", "મૂળા", /radish/], ["Pumpkin", "कद्दू", "કોળું", /pumpkin/]],
  [["Toor dal", "तुअर दाल", "તુવેર દાળ", /toor/], ["Moong", "मूँग", "મગ", /moong/],
   ["Chana dal", "चना दाल", "ચણાની દાળ", /chana dal/], ["Masoor dal", "मसूर दाल", "મસૂર દાળ", /red lentils|masoor/],
   ["Urad dal", "उड़द दाल", "અડદની દાળ", /urad/], ["Kabuli chana", "काबुली चना", "કાબુલી ચણા", without(/chickpea/, /black chickpeas/g)],
   ["Kala chana", "काला चना", "કાળા ચણા", /black chickpeas/], ["Rajma", "राजमा", "રાજમા", /rajma|kidney/],
   ["Lobia", "लोबिया", "ચોળા", /black eyed/], ["White peas", "सफ़ेद मटर", "સફેદ વટાણા", /white peas/],
   ["Sprouts", "अंकुरित", "ફણગાવેલા", /sprout/], ["Soya chunks", "सोया चंक्स", "સોયા ચંક્સ", /soya chunks/]],
  [["Rice", "चावल", "ચોખા", without(/\brice\b/, /rice flour|puffed rice/g)], ["Rava (sooji)", "सूजी (रवा)", "રવો (સોજી)", /semolina|\brava\b/],
   ["Besan", "बेसन", "ચણાનો લોટ", /besan/], ["Poha", "पोहा", "પૌંઆ", /poha/],
   ["Dalia", "दलिया", "ફાડા", /broken wheat/], ["Oats", "ओट्स", "ઓટ્સ", /oats/],
   ["Ragi", "रागी (नाचनी)", "રાગી (નાગલી)", /ragi/], ["Jowar", "ज्वार", "જુવાર", /jowar/],
   ["Bajra", "बाजरा", "બાજરી", /bajra/], ["Millets", "मिलेट (कोदो, सामा)", "મિલેટ (કોદરી, સામો)", /millet/],
   ["Quinoa", "किनोआ", "કિનોઆ", /quinoa/], ["Sabudana", "साबूदाना", "સાબુદાણા", /sago/], ["Sattu", "सत्तू", "સત્તુ", /sattu/]],
  [["Paneer", "पनीर", "પનીર", /paneer/], ["Curd", "दही", "દહીં", /curd/],
   ["Cheese", "चीज़", "ચીઝ", /cheese|mozzarella|parmesan/], ["Tofu", "टोफू", "ટોફુ", /tofu/]],
  [["Bread", "ब्रेड", "બ્રેડ", without(/\bbread\b/, /bread crumbs/g)], ["Pav", "पाव", "પાવ", /\bpav\b|\bbuns\b/],
   ["Roti", "रोटी", "રોટલી", /\broti\b|tortilla/], ["Pasta", "पास्ता", "પાસ્તા", /pasta|macaroni|spaghetti/],
   ["Noodles", "नूडल्स", "નૂડલ્સ", without(/noodles/, /fried noodles/g)], ["Idli dosa batter", "इडली डोसे का घोल", "ઈડલી ઢોસાનું ખીરું", /dosa batter|idli batter/],
   ["Peanuts", "मूंगफली", "સીંગદાણા", /peanut/], ["Coconut", "नारियल", "નાળિયેર", without(/coconut/, /coconut milk/g)],
   ["Makhana", "मखाना", "મખાના", /makhana/]]
];
const ING = GROUPS.flat();
const has = (g, s) => typeof g[3] === "function" ? g[3](s) : g[3].test(s);
const LI = { en: 0, hi: 1, gu: 2 };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const FIVE_DAYS = 5 * 864e5;
let made = store.get("akb_made", {});
const recent = r => made[r.id] && Date.now() - made[r.id] < FIVE_DAYS;

const hour = new Date().getHours();
let SUNDAY = new Date().getDay() === 0;
const S = {
  lang: store.get("akb_lang", null),
  meal: hour < 11 ? "b" : hour < 15 ? "l" : hour < 18 ? "s" : "d",
  view: "home", picked: new Set(), list: [], page: 0, recipe: null, from: "home", justMade: false
};
const t = () => L[S.lang || "en"];
const nm = r => r.n[S.lang || "en"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function fitsMeal(r) {
  if (S.meal === "b") return r.meal === "Breakfast";
  if (S.meal === "l") return r.meal === "Lunch/Dinner";
  if (S.meal === "s") return r.meal === "Snack" || r.f === "Chaat";
  return r.meal === "Dinner" || r.meal === "Lunch/Dinner";
}
// recently made dishes go to the back of the queue
const order = a => a.filter(r => !recent(r)).concat(a.filter(recent));

function listAuto() {
  let pool = R.filter(r => fitsMeal(r) && r.mood !== "Weekend project");
  if (S.meal === "d") {            // dinner in this house is rarely roti-sabzi: lead with the variety dishes
    const v = shuffle(pool.filter(r => r.f !== "Regular meal")), g = shuffle(pool.filter(r => r.f === "Regular meal"));
    const out = []; while (v.length || g.length) { out.push(...v.splice(0, 2)); out.push(...g.splice(0, 1)); }
    return order(out);
  }
  if (S.meal === "l" && SUNDAY) {   // Sunday lunch leads with the bigger, special dishes
    pool = R.filter(r => r.meal === "Lunch/Dinner");
    return order(shuffle(pool.filter(r => r.sun)).concat(shuffle(pool.filter(r => !r.sun))));
  }
  return order(shuffle(pool));
}
function listIng() {
  const sel = [...S.picked];
  const scored = [];
  for (const r of R) {
    const s = r.ing.toLowerCase();
    const hit = sel.filter(i => has(ING[i], s));
    if (hit.length) scored.push({ r, hit, k: hit.length * 10 + (fitsMeal(r) ? 2 : 0) + Math.random() });
  }
  scored.sort((a, b) => b.k - a.k);
  scored.forEach(x => x.r._hit = x.hit);
  return order(scored.map(x => x.r));
}
const mealFirst = a => { a = shuffle(a); return order(a.filter(fitsMeal).concat(a.filter(r => !fitsMeal(r)))); };
const listMood = m => mealFirst(R.filter(r => r.mood === m));
const listHealthy = () => mealFirst(R.filter(r => r.h));
const listKind = k => mealFirst(R.filter(r => r.k === k));

const CHEV = '<svg viewBox="0 0 14 22" aria-hidden="true"><path d="M11 2 3 11l8 9" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LANGBTN = '<button class="bar-btn" data-act="lang" aria-label="Language">A अ અ</button>';
const bar = back => `<div class="bar">${back ? `<button class="bar-btn" data-act="back">${CHEV}${esc(t().back)}</button>` : '<span class="spacer"></span>'}${LANGBTN}</div>`;

function metaLine(r) {
  const T = t();
  let h = `<div class="meta"><span class="time">${r.t} ${esc(T.min)}</span><span>${esc(T.effort[r.e])}</span></div>`;
  if (r.h) h = h.replace("</div>", `<span class="good">${esc(T.good)}</span></div>`);
  if (r.p !== "Everyday") h += `<div class="note">${esc(r.p === "Exotic" ? T.p2 : T.p1)}</div>`;
  return h;
}

const V = {
  lang() {
    return `<div class="bar"><span class="spacer"></span></div>
      <p class="who">भाषा &nbsp; ભાષા &nbsp; Language</p>
      <div class="langs">
        <button class="door" data-lang="hi"><b>हिंदी</b></button>
        <button class="door" data-lang="gu"><b>ગુજરાતી</b></button>
        <button class="door" data-lang="en"><b>English</b></button>
      </div>`;
  },
  home() {
    const T = t();
    const meals = ["b", "l", "s", "d"].map(m => `<button data-meal="${m}" aria-pressed="${S.meal === m}">${esc(SUNDAY && m === "l" ? T.sunL : T.meal[m])}</button>`).join("");
    const door = (k, cls) => `<button class="door ${cls || ""}" data-go="${k}"><b>${esc(T[k][0])}</b><span>${esc(T[k][1])}</span></button>`;
    return `${bar(false)}<h1>${esc(SUNDAY && S.meal === "l" ? T.sunQ : T.q[S.meal])}</h1>
      <div class="meals" role="group">${meals}</div>
      <div class="stack">${door("auto", "lead")}${door("ing")}${door("mood")}${door("kind")}${door("hl")}</div>`;
  },
  ing() {
    const T = t(), i = LI[S.lang];
    let n = 0;
    const chips = GROUPS.map((grp, gi) => `<h2 class="grp">${esc(T.grp[gi])}</h2><div class="chips">${
      grp.map(g => { const k = n++; return `<button class="chip" data-ing="${k}" aria-pressed="${S.picked.has(k)}"><i></i>${esc(g[i])}</button>`; }).join("")}</div>`).join("");
    const none = S.picked.size === 0;
    return `${bar(true)}<h1 class="small">${esc(T.ingQ)}</h1>${chips}
      <div class="sticky"><button class="go" data-go="ingres" ${none ? "disabled" : ""}>${esc(none ? T.pickFirst : T.show)}</button></div>`;
  },
  mood() {
    const T = t(), i = LI[S.lang] + 2;
    return `${bar(true)}<h1 class="small">${esc(T.moodQ)}</h1><div class="stack">${
      MOODS.map(m => `<button class="row" data-mood="${esc(m[0])}"><span class="bowl" style="background:${m[1]}"></span>${esc(m[i])}</button>`).join("")}</div>`;
  },
  kind() {
    const T = t(), i = LI[S.lang] + 1;
    return `${bar(true)}<h1 class="small">${esc(T.kindQ)}</h1><div class="stack">${
      KINDS.map(k => `<button class="row" data-kind="${esc(k[0])}">${esc(k[i])}</button>`).join("")}</div>`;
  },
  results() {
    const T = t(), i = LI[S.lang];
    if (!S.list.length) return `${bar(true)}<div class="empty">${esc(T.none)}</div>`;
    const three = S.list.slice(S.page * 3, S.page * 3 + 3);
    const cards = three.map(r => {
      const en = S.lang !== "en" ? `<span class="en">${esc(r.n.en)}</span>` : "";
      const have = S.from === "ing" && r._hit ? `<div class="have">${esc(T.have)}: ${esc(r._hit.map(h => ING[h][i]).join(", "))}</div>` : "";
      return `<button class="card" data-recipe="${r.id}"><b>${esc(nm(r))}</b>${en}${metaLine(r)}${have}</button>`;
    }).join("");
    const more = S.list.length > 3 ? `<button class="go alt" data-act="more">${esc(T.more)}</button>` : "";
    return `${bar(true)}<h1 class="small">${esc(T.resQ)}</h1><div class="stack">${cards}</div>${more}`;
  },
  recipe() {
    const T = t(), r = S.recipe;
    const X = S.lang !== "en" && r.x ? r.x[S.lang] : null;
    const li = a => a.map(v => `<li>${esc(v)}</li>`).join("");
    let ings = r.ing.split(/,\s*(?![^()]*\))/).map(x => `<li>${esc(x.charAt(0).toUpperCase() + x.slice(1))}</li>`).join("");
    let subs = r.sub.split(/;\s*/).map(x => {
      const p = x.split(/\s*>\s*/);
      return `<li>${esc(p.length === 2 ? T.sub(p[0].charAt(0).toUpperCase() + p[0].slice(1), p[1]) : x)}</li>`;
    }).join("");
    let steps = r.m.split(/\.\s+(?=[A-Z])/).map(x => `<li><span>${esc(/\.$/.test(x) ? x : x + '.')}</span></li>`).join("");
    const en = S.lang !== "en" ? `<span class="en">${esc(r.n.en)}</span>` : "";
    if (X) { ings = li(X.ing); subs = li(X.sub); steps = X.m.map(v => `<li><span>${esc(v)}</span></li>`).join(""); }
    const eng = T.eng && !X ? `<p class="eng">${esc(T.eng)}</p>` : "";
    const btn = S.justMade || recent(r)
      ? `<button class="go done" disabled>${esc(T.made)}</button>`
      : `<button class="go decide" data-act="make">${esc(T.make)}</button>`;
    return `${bar(true)}
      <div class="card" style="background:transparent;padding:0"><b style="font-size:clamp(34px,9.5vw,46px)">${esc(nm(r))}</b>${en}${metaLine(r)}<div>${esc(T.serves)}</div></div>
      <div class="sheet">${eng}
        <section><h2>${esc(T.need)}</h2><ul>${ings}</ul></section>
        <section><h2>${esc(T.subs)}</h2><ul>${subs}</ul></section>
        <section><h2>${esc(T.how)}</h2><ol>${steps}</ol></section>
      </div>
      ${btn}
      <button class="go alt" data-act="home">${esc(T.home)}</button>`;
  }
};

const app = document.getElementById("app");
function render(keepScroll) {
  const view = S.lang ? S.view : "lang";
  document.documentElement.lang = S.lang || "en";
  app.innerHTML = V[view]();
  if (!keepScroll) window.scrollTo(0, 0);
}
function results(list, from) { S.list = list; S.page = 0; S.from = from; S.view = "results"; render(); }

app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.lang) { S.lang = d.lang; store.set("akb_lang", S.lang); if (S.view === "lang") S.view = S.prev || "home"; render(); }
  else if (d.meal) { S.meal = d.meal; render(true); }
  else if (d.ing) { const n = +d.ing; S.picked.has(n) ? S.picked.delete(n) : S.picked.add(n); render(true); }
  else if (d.mood) results(listMood(d.mood), "mood");
  else if (d.kind) results(listKind(d.kind), "kind");
  else if (d.recipe) { S.recipe = R.find(r => r.id === d.recipe); S.justMade = false; S.view = "recipe"; render(); }
  else if (d.go === "auto") results(listAuto(), "home");
  else if (d.go === "ingres") results(listIng(), "ing");
  else if (d.go === "hl") results(listHealthy(), "home");
  else if (d.go) { S.view = d.go; render(); }
  else if (d.act === "more") { S.page = (S.page + 1) * 3 >= S.list.length ? 0 : S.page + 1; render(); }
  else if (d.act === "home") { S.view = "home"; S.picked.clear(); render(); }
  else if (d.act === "lang") { S.prev = S.view; S.lang = null; S.view = "lang"; render(); }
  else if (d.act === "make") { made[S.recipe.id] = Date.now(); store.set("akb_made", made); S.justMade = true; render(true); }
  else if (d.act === "back") {
    if (S.view === "recipe") S.view = "results";
    else if (S.view === "results") S.view = S.from;
    else S.view = "home";
    render();
  }
});
render();
// Installable app: offline cache. Skipped silently where service workers are not allowed.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
}
